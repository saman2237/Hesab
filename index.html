function parseJDate(s) {
  if (!s) return null;
  const parts = String(s).split("-");
  if (parts.length === 3) return { y: Number(parts[0]), m: Number(parts[1]), d: Number(parts[2]) };
  return null;
}
function jdateToStr(j) { const p = (n) => String(n).padStart(2, "0"); return `${j.y}-${p(j.m)}-${p(j.d)}`; }
function jdateLabel(j) { if (!j) return "—"; return `${j.d} ${JMONTHS[j.m - 1]} ${j.y}`; }

function categorize(label, extraNames) {
  const l = label || "";
  const has = (s) => l.indexOf(s) !== -1;
  if (has("رئوف")) return "کاک رئوف";
  if (has("صاله") || has("ساله") || has("ساڵه") || has("ساڵە")) return "کاک صاله";
  if (has("خودم")) return "خودم";
  if (has("سعید")) return "سعید";
  // dynamic: any custom person name that appears in the label
  if (extraNames) {
    for (let i = 0; i < extraNames.length; i++) {
      const nm = (extraNames[i] || "").trim();
      if (nm && nm.length >= 2 && has(nm)) return nm;
    }
  }
  return "سایر";
}
// collect all custom person names used anywhere (transfer accounts), so tools recognize them
function knownPersonNames(data) {
  const set = new Set();
  if (data && data.transferAccounts) {
    Object.values(data.transferAccounts).forEach((accs) => (accs || []).forEach((a) => { if (a.person) set.add(a.person.trim()); }));
  }
  return Array.from(set);
}

const CATEGORY_COLORS = { "سعید": "#5E86AE", "خودم": "#4F8F73", "کاک صاله": "#B8895A", "کاک رئوف": "#8A6BAE", "سایر": "#8A8272" };
const PERSON_PALETTE = ["#5E86AE", "#4F8F73", "#B8895A", "#8A6BAE", "#B15E52", "#4D9AA6", "#A98A3E", "#7A6BB0", "#3E8E7E", "#C08457", "#6B8E4E", "#B05C7A"];
function personColor(name) {
  const key = (name || "").trim();
  if (CATEGORY_COLORS[key]) return CATEGORY_COLORS[key];
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) % 100000;
  return PERSON_PALETTE[h % PERSON_PALETTE.length];
}

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return "";
  const sign = n < 0 ? "-" : "";
  return sign + Math.abs(Math.round(n)).toLocaleString("en-US");
}
function costItemTotal(item) {
  if (item.count !== null && item.count !== undefined && item.rate !== null && item.rate !== undefined) return item.count * item.rate;
  return item.amount || 0;
}
function monthCostTotal(month) { return month.costItems.reduce((s, i) => s + costItemTotal(i), 0); }
function monthDepositTotal(month) { return month.deposits.reduce((s, d) => s + (d.amount || 0), 0); }
function monthBalance(month) { return monthCostTotal(month) - monthDepositTotal(month); }
function expensesTotal(expenses) { return expenses.reduce((s, e) => s + (e.amount || 0), 0); }
function accountTotal(acc) { return acc.entries.reduce((s, e) => s + (e.amount || 0), 0); }
function receiptsListTotal(list) { return (list || []).reduce((s, r) => s + (r.amount || 0), 0); }
function categoryTotals(deposits) {
  const t = { "سعید": 0, "خودم": 0, "کاک صاله": 0, "کاک رئوف": 0, "سایر": 0 };
  deposits.forEach((d) => { t[categorize(d.label)] += d.amount || 0; });
  return t;
}
function autoEntriesFor(month, category) {
  return month.deposits.filter((d) => categorize(d.label) === category);
}
function searchAll(data, query) {
  const q = (query || "").trim();
  if (!q) return [];
  const hits = [];
  data.months.forEach((m) => {
    m.deposits.forEach((d) => {
      if ((d.label || "").indexOf(q) !== -1) hits.push({ kind: "دریافتی (دفتر کارت)", month: m.name, label: d.label, date: d.date, amount: d.amount || 0 });
    });
    m.costItems.forEach((it) => {
      if ((it.label || "").indexOf(q) !== -1) hits.push({ kind: "هزینه (دفتر کارت)", month: m.name, label: it.label, date: null, amount: costItemTotal(it) });
    });
    const accs = (data.transferAccounts && data.transferAccounts[m.id]) || [];
    accs.forEach((a) => {
      if ((a.person || "").indexOf(q) !== -1) {
        a.entries.forEach((e) => hits.push({ kind: "واریزی به " + a.person, month: m.name, label: a.person + (e.bank ? " — " + e.bank : ""), date: e.date, amount: e.amount || 0 }));
      }
    });
    const recs = (data.transferReceipts && data.transferReceipts[m.id]) || [];
    recs.forEach((r) => {
      if ((r.label || "").indexOf(q) !== -1) hits.push({ kind: "دریافتی دستی", month: m.name, label: r.label, date: r.date, amount: r.amount || 0 });
    });
  });
  (data.expenses || []).forEach((e) => {
    if ((e.title || "").indexOf(q) !== -1 || (e.payer || "").indexOf(q) !== -1) hits.push({ kind: "هزینه جانبی", month: e.period || "—", label: e.title + (e.payer ? " (" + e.payer + ")" : ""), date: null, amount: e.amount || 0 });
  });
  return hits;
}
function peopleSummary(data) {
  // For each person: ledgerReceived (from دفتر کارت deposits), manualReceived (from دریافتی‌ها tab),
  // and paid (money you sent them in واریزی‌ها). Any name appearing in transfer accounts is included too.
  const extra = knownPersonNames(data);
  const map = {};
  const ensure = (name) => { const key = (name || "").trim(); if (!key) return null; if (!map[key]) map[key] = { name: key, ledgerReceived: 0, manualReceived: 0, paid: 0 }; return map[key]; };
  data.months.forEach((m) => {
    m.deposits.forEach((d) => {
      const cat = categorize(d.label, extra);
      if (cat !== "سایر") { const p = ensure(cat); if (p) p.ledgerReceived += d.amount || 0; }
    });
    const recs = (data.transferReceipts && data.transferReceipts[m.id]) || [];
    recs.forEach((r) => { const cat = categorize(r.label, extra); if (cat !== "سایر" && r.label) { const p = ensure(cat); if (p) p.manualReceived += r.amount || 0; } });
    const accs = (data.transferAccounts && data.transferAccounts[m.id]) || [];
    accs.forEach((a) => { const p = ensure(a.person); if (p) p.paid += accountTotal(a); });
  });
  return Object.values(map)
    .filter((p) => p.ledgerReceived || p.manualReceived || p.paid)
    .sort((a, b) => (b.ledgerReceived + b.manualReceived + b.paid) - (a.ledgerReceived + a.manualReceived + a.paid));
}
function monthReceiptsTotal(month, receiptsList) {
  return receiptsListTotal(receiptsList) + autoEntriesFor(month, "خودم").reduce((s, e) => s + (e.amount || 0), 0) + autoEntriesFor(month, "سعید").reduce((s, e) => s + (e.amount || 0), 0);
}
function monthPaymentsTotal(accounts) { return (accounts || []).reduce((s, a) => s + accountTotal(a), 0); }
function monthTransfersNet(month, accounts, receiptsList) { return monthReceiptsTotal(month, receiptsList) - monthPaymentsTotal(accounts); }
function monthTransfersTotal(month, manualAccounts) {
  const manual = (manualAccounts || []).reduce((s, a) => s + accountTotal(a), 0);
  const auto = autoEntriesFor(month, "خودم").reduce((s, d) => s + (d.amount || 0), 0) + autoEntriesFor(month, "سعید").reduce((s, d) => s + (d.amount || 0), 0);
  return manual + auto;
}

function buildSummaryText(data, grandBalance) {
  const lines = ["📒 دفتر کارت مرزی و واریزی‌ها", ""];
  data.months.forEach((m) => {
    const bal = monthBalance(m);
    lines.push(`▪️ ${m.name}`);
    lines.push(`   هزینه: ${fmt(monthCostTotal(m))} ریال`);
    lines.push(`   واریزی: ${fmt(monthDepositTotal(m))} ریال`);
    lines.push(`   ${bal > 0 ? "بدهی" : "بستانکاری"}: ${fmt(Math.abs(bal))} ریال`);
    lines.push("");
  });
  if (data.previousDebt) lines.push(`بدهی قبلی: ${fmt(data.previousDebt)} ریال`, "");
  lines.push("———");
  lines.push(`مانده کلی: ${fmt(Math.abs(grandBalance))} ریال (${grandBalance > 0 ? "بدهکار" : "طلبکار"})`);
  lines.push("", "———", "💰 هزینه‌های جانبی:");
  lines.push(`جمع: ${fmt(expensesTotal(data.expenses || []))} ریال`);
  return lines.join("\n");
}
function buildSummaryTextForMonth(m) {
  const bal = monthBalance(m);
  const lines = [`📒 ${m.name} — دفتر کارت مرزی`, ""];
  lines.push("هزینه‌ها:");
  m.costItems.forEach((it) => lines.push(`  ${it.label || "—"}: ${fmt(costItemTotal(it))} ریال`));
  lines.push("", "دریافتی‌ها:");
  m.deposits.forEach((d) => lines.push(`  ${jdateLabel(parseJDate(d.date))} — ${d.label || "—"}: ${fmt(d.amount || 0)} ریال`));
  lines.push("", `${bal > 0 ? "بدهی ماه" : "بستانکاری ماه"}: ${fmt(Math.abs(bal))} ریال`);
  return lines.join("\n");
}

    @media print{button{display:none}}
  </style></head><body>

async function shareText(text, title) {
  try { if (navigator.share) { await navigator.share({ title: title || "دفتر کارت مرزی", text }); return "shared"; } }
  catch (e) { if (e && e.name === "AbortError") return "cancelled"; }
  try { await navigator.clipboard.writeText(text); return "copied"; } catch (e) { return "failed"; }
}
function hashColor(str) {
  const palette = ["#B8895A", "#4F8F73", "#5E86AE", "#B15E52", "#8A6BAE", "#4D9AA6", "#A98A3E"];
  let h = 0;
  for (let i = 0; i < (str || "").length; i++) h = (h * 31 + str.charCodeAt(i)) % 997;
  return palette[h % palette.length];
}
async function sendTelegramBackup(config, data) {
  if (!config || !config.enabled || !config.token || !config.chatId) return "disabled";
  try {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const form = new FormData();
    form.append("chat_id", config.chatId);
    form.append("caption", "پشتیبان خودکار دفتر کارت مرزی");
    form.append("document", blob, `پشتیبان-${Date.now()}.json`);
    const res = await fetch(`https://api.telegram.org/bot${config.token}/sendDocument`, { method: "POST", body: form });
    const j = await res.json();
    return j.ok ? "sent" : "failed";
  } catch (e) { return "failed"; }
}

function NumberInput({ value, onChange, placeholder, style, readOnly, color }) {
  const [focused, setFocused] = useState(false);

    <input style={{ ...inputBase, ...style, color: color || INK, fontFamily: MONO }} placeholder={placeholder} readOnly={readOnly}

      onFocus={() => { setFocused(true); setText(value === null || value === undefined ? "" : String(value)); }}
      onBlur={() => setFocused(false)}
      onChange={(e) => { const raw = e.target.value.replace(/[^0-9]/g, ""); setText(raw); onChange(raw === "" ? null : Number(raw)); }} />

function DateField({ value, onChange, compact }) {

function App() {
  const [data, setData] = useState(null);
  const [openMonth, setOpenMonth] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState("");

  const [saveError, setSaveError] = useState(false);
  const [tab, setTab] = useState("ledger");
  const [openTransferMonth, setOpenTransferMonth] = useState(null);
  const [locked, setLocked] = useState(false);
  const [pinEntry, setPinEntry] = useState("");
  const [searchOpen, setSearchOpen] = useState(false);
  const [searchQ, setSearchQ] = useState("");
  const fileInputRef = useRef(null);
  const tgTimer = useRef(null);

  const MAIN_KEY = "border-ledger-data-v4";
  const BACKUP_KEYS = ["border-ledger-backup-1", "border-ledger-backup-2", "border-ledger-backup-3"];

  function normalize(d) {
    if (!d.expenses) d.expenses = [];
    if (!d.transferAccounts) d.transferAccounts = {};
    if (!d.transferReceipts) d.transferReceipts = {};
    if (!d.telegramConfig) d.telegramConfig = { token: "", chatId: "", enabled: false, frequency: "always", lastSent: 0 };
    if (!d.telegramConfig.frequency) d.telegramConfig.frequency = "always";
    if (!d.telegramConfig.lastSent) d.telegramConfig.lastSent = 0;
    if (!d.security) d.security = { pin: "" };
    if (!d.currency) d.currency = { usdToToman: 0 };
    if (!d.notes) d.notes = [];
    // migrate legacy `transferMonths` (array-based, from an earlier version) into transferAccounts keyed by ledger month id
    if (Array.isArray(d.transferMonths) && d.transferMonths.length) {
      d.transferMonths.forEach((tm) => {
        const match = d.months.find((m) => m.name === tm.name);
        if (match && (!d.transferAccounts[match.id] || d.transferAccounts[match.id].length === 0)) {
          d.transferAccounts[match.id] = tm.accounts || [];
        }
      });
    }
    return d;
  }
  function loadBestAvailable() {
    for (const k of [MAIN_KEY, ...BACKUP_KEYS]) {
      try {
        const raw = localStorage.getItem(k);
        if (raw) { const parsed = JSON.parse(raw); if (parsed && Array.isArray(parsed.months)) return normalize(parsed); }
      } catch (e) {}
    }
    return null;
  }

  useEffect(() => {
    const found = loadBestAvailable();
    const chosen = found || seedRaw();
    setData(chosen);
    if (chosen.months[0]) { setOpenMonth(chosen.months[0].id); setOpenTransferMonth(chosen.months[0].id); }
    if (chosen.security && chosen.security.pin) setLocked(true);
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded || !data) return;
    try {
      const json = JSON.stringify(data);
      try {
        const prev = localStorage.getItem(BACKUP_KEYS[1]); if (prev) localStorage.setItem(BACKUP_KEYS[2], prev);
        const prev1 = localStorage.getItem(BACKUP_KEYS[0]); if (prev1) localStorage.setItem(BACKUP_KEYS[1], prev1);
        const mainNow = localStorage.getItem(MAIN_KEY); if (mainNow) localStorage.setItem(BACKUP_KEYS[0], mainNow);
      } catch (e) {}
      localStorage.setItem(MAIN_KEY, json);
      setLastSaved(new Date());
      setSaveError(false);
    } catch (e) { setSaveError(true); }

    if (data.telegramConfig && data.telegramConfig.enabled) {
      if (tgTimer.current) clearTimeout(tgTimer.current);
      tgTimer.current = setTimeout(async () => {
        const freq = data.telegramConfig.frequency || "always";
        const now = Date.now();
        const since = now - (data.telegramConfig.lastSent || 0);
        const DAY = 86400000;
        if (freq === "daily" && since < DAY) return;
        if (freq === "weekly" && since < 7 * DAY) return;
        const r = await sendTelegramBackup(data.telegramConfig, data);
        if (r === "sent") { flashToast("پشتیبان به تلگرام ارسال شد ✓"); setData((d) => ({ ...d, telegramConfig: { ...d.telegramConfig, lastSent: now } })); }
        if (r === "failed") flashToast("ارسال به تلگرام ناموفق بود");
      }, 45000);
    }
    return () => { if (tgTimer.current) clearTimeout(tgTimer.current); };
  }, [data, loaded]);

  function flashToast(msg) { setToast(msg); setTimeout(() => setToast(""), 2400); }
  async function handleShareAll() { const r = await shareText(buildSummaryText(data, grandBalance)); if (r === "copied") flashToast("خلاصه در کلیپ‌بورد کپی شد ✓"); if (r === "failed") flashToast("اشتراک‌گذاری ممکن نشد"); }
  async function handleShareMonth(m) { const r = await shareText(buildSummaryTextForMonth(m), m.name); if (r === "copied") flashToast("خلاصه در کلیپ‌بورد کپی شد ✓"); if (r === "failed") flashToast("اشتراک‌گذاری ممکن نشد"); }

  function handleExport() {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const now = new Date();
      const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      a.href = url; a.download = `دفتر-کارت-مرزی-پشتیبان-${stamp}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      flashToast("فایل پشتیبان دانلود شد ✓");
    } catch (e) { flashToast("دانلود پشتیبان ممکن نشد"); }
  }

  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.months)) throw new Error("bad shape");
        if (!confirm("بازیابی این فایل، اطلاعات فعلی را جایگزین می‌کند. ادامه می‌دهید؟")) return;

        flashToast("اطلاعات بازیابی شد ✓");

    else if (r === "disabled") flashToast("ابتدا توکن و چت‌آیدی را وارد کن");

  function addMonth() { const name = prompt("نام ماه جدید را وارد کنید:"); if (!name) return; const newM = { id: uid(), name, note: "", costItems: [], deposits: [] }; setData((d) => ({ ...d, months: [...d.months, newM] })); setOpenMonth(newM.id); }
  function removeMonth(id) { if (!confirm("این ماه حذف شود؟")) return; setData((d) => ({ ...d, months: d.months.filter((m) => m.id !== id), transferAccounts: Object.fromEntries(Object.entries(d.transferAccounts).filter(([k]) => k !== id)), transferReceipts: Object.fromEntries(Object.entries(d.transferReceipts).filter(([k]) => k !== id)) })); }

  function addExpense() { setData((d) => ({ ...d, expenses: [...d.expenses, { id: uid(), title: "", amount: null, payer: "خودم", period: "" }] })); }

  function removeExpense(id) { setData((d) => ({ ...d, expenses: d.expenses.filter((e) => e.id !== id) })); }

  function updateTransferAccounts(monthId, fn) { setData((d) => ({ ...d, transferAccounts: { ...d.transferAccounts, [monthId]: fn(d.transferAccounts[monthId] || []) } })); }
  function updateTransferReceipts(monthId, fn) { setData((d) => ({ ...d, transferReceipts: { ...d.transferReceipts, [monthId]: fn(d.transferReceipts[monthId] || []) } })); }
  function updateTelegramConfig(field, value) { setData((d) => ({ ...d, telegramConfig: { ...d.telegramConfig, [field]: value } })); }
  function setPin(pin) { setData((d) => ({ ...d, security: { ...d.security, pin } })); }
  function updateCurrency(field, value) { setData((d) => ({ ...d, currency: { ...d.currency, [field]: value } })); }
  function addNote() { setData((d) => ({ ...d, notes: [{ id: uid(), text: "", ts: Date.now(), done: false }, ...d.notes] })); }
  function updateNote(id, field, value) { setData((d) => ({ ...d, notes: d.notes.map((n) => (n.id === id ? { ...n, [field]: value } : n)) })); }
  function removeNote(id) { setData((d) => ({ ...d, notes: d.notes.filter((n) => n.id !== id) })); }

function MonthCard({ month, isOpen, onToggle, onChange, onRemove, onShare }) {
  const costTotal = monthCostTotal(month), depositTotal = monthDepositTotal(month), balance = monthBalance(month), owed = balance > 0;
  const catTotals = categoryTotals(month.deposits);
  function updateField(list, id, field, value) { onChange((m) => ({ ...m, [list]: m[list].map((it) => (it.id === id ? { ...it, [field]: value } : it)) })); }
  function removeItem(list, id) { onChange((m) => ({ ...m, [list]: m[list].filter((it) => it.id !== id) })); }
  function addCostItem() { onChange((m) => ({ ...m, costItems: [...m.costItems, { id: uid(), label: "", count: null, rate: null, amount: null }] })); }
  function addDeposit() { const lastDate = month.deposits.length ? month.deposits[month.deposits.length - 1].date : "1405-01-01"; onChange((m) => ({ ...m, deposits: [...m.deposits, { id: uid(), date: lastDate, label: "", amount: null }] })); }
  return (
    <div style={{ background: CARD, border: `1px solid ${LINE}`, borderRadius: 16, marginTop: 14, boxShadow: "0 1px 2px rgba(54,64,74,0.06)", overflow: "hidden" }}>
      <button onClick={onToggle} style={{ width: "100%", background: "transparent", border: "none", padding: "15px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ fontSize: 16, fontWeight: 800, color: INK, fontFamily: DISPLAY_FONT }}>{month.name}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ textAlign: "left" }}><div style={{ fontFamily: MONO, fontSize: 13.5, fontWeight: 600, color: owed ? RUST : SAGE }}>{fmt(Math.abs(balance))}</div><div style={{ fontSize: 9.5, color: INK, opacity: 0.5 }}>{owed ? "بدهی ماه" : "بستانکاری"}</div></div>
          <IconChevron size={17} color={INK} style={{ transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.2s", opacity: 0.55 }} />
        </div>
      </button>
      {isOpen && (
        <div style={{ padding: "0 14px 16px" }}>
          {month.note ? <div style={{ display: "flex", gap: 6, background: "#F3EBDF", border: "1px solid #E4D3BC", borderRadius: 10, padding: "8px 10px", fontSize: 12, color: "#7A5426", marginBottom: 12, alignItems: "flex-start" }}><IconAlert size={13} /> <span>{month.note}</span></div> : null}
          <SectionLabel icon={<IconCard size={12} />} text="هزینه‌ها و خرید کارت" total={costTotal} color={GOLD} />
          {month.costItems.map((item) => <CostRow key={item.id} item={item} onChange={(f, v) => updateField("costItems", item.id, f, v)} onRemove={() => removeItem("costItems", item.id)} />)}

          <SectionLabel icon={<IconWallet size={12} />} text="دریافتی‌ها" total={depositTotal} color={SAGE} style={{ marginTop: 18 }} />
          {month.deposits.map((dep) => <DepositRow key={dep.id} dep={dep} onChange={(f, v) => updateField("deposits", dep.id, f, v)} onRemove={() => removeItem("deposits", dep.id)} />)}
          <RowAddBtn onClick={addDeposit} text="افزودن دریافتی" />

          <div style={{ marginTop: 16, background: "#FFFFFF", border: `1px solid ${LINE}`, borderRadius: 11, padding: "10px 11px" }}>
            <div style={{ fontSize: 10.5, fontWeight: 700, color: INK, opacity: 0.6, marginBottom: 7 }}>تفکیک واریزی بر اساس نام</div>
            {CATEGORY_ORDER.map((cat) => catTotals[cat] > 0 ? (
              <div key={cat} style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", fontSize: 12 }}>
                <span style={{ display: "flex", alignItems: "center", gap: 6, color: INK }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: CATEGORY_COLORS[cat], display: "inline-block" }} />{cat}</span>
                <span style={{ fontFamily: MONO, fontWeight: 600, color: INK }}>{fmt(catTotals[cat])}</span>

              </div>

          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 14 }}>

function TransferMonthCard({ month, accounts, receipts, isOpen, onToggle, onChangeAccounts, onChangeReceipts }) {
  const [receiptsOpen, setReceiptsOpen] = useState(true);
  const [paymentsOpen, setPaymentsOpen] = useState(true);
  const autoKhodam = autoEntriesFor(month, "خودم");
  const autoSaeed = autoEntriesFor(month, "سعید");
  const receiptsTotal = receiptsListTotal(receipts) + autoKhodam.reduce((s, e) => s + (e.amount || 0), 0) + autoSaeed.reduce((s, e) => s + (e.amount || 0), 0);
  const paymentsTotal = accounts.reduce((s, a) => s + accountTotal(a), 0);

  function updateAccount(accId, fn) { onChangeAccounts((accs) => accs.map((a) => (a.id === accId ? fn(a) : a))); }
  function addAccount() { onChangeAccounts((accs) => [...accs, { id: uid(), person: "", entries: [] }]); }
  function removeAccount(accId) { if (!confirm("این حساب حذف شود؟")) return; onChangeAccounts((accs) => accs.filter((a) => a.id !== accId)); }

  function updateReceipt(id, field, value) { onChangeReceipts((list) => list.map((r) => (r.id === id ? { ...r, [field]: value } : r))); }
  function removeReceipt(id) { onChangeReceipts((list) => list.filter((r) => r.id !== id)); }
  function addReceipt() { const lastDate = receipts.length ? receipts[receipts.length - 1].date : "1405-01-01"; onChangeReceipts((list) => [...list, { id: uid(), label: "", date: lastDate, amount: null }]); }

  return (
    <div style={{ background: CARD, border: `1px solid ${LINE}`, borderRadius: 16, marginTop: 14, boxShadow: "0 1px 2px rgba(54,64,74,0.06)", overflow: "hidden" }}>

          </div>
          <IconChevron size={17} color={INK} style={{ transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.2s", opacity: 0.55 }} />
        </div>
      </button>
      {isOpen && (
        <div style={{ padding: "0 14px 16px" }}>
          <button onClick={() => setReceiptsOpen((o) => !o)} style={{ width: "100%", background: "transparent", border: "none", padding: "6px 0", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, color: SAGE, fontSize: 11.5, fontWeight: 700 }}><IconWallet size={12} /> دریافتی‌ها</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontFamily: MONO, fontSize: 12.5, fontWeight: 600, color: INK, opacity: 0.75 }}>{fmt(receiptsTotal)}</span>
              <IconChevron size={14} color={INK} style={{ transform: receiptsOpen ? "rotate(180deg)" : "none", transition: "transform 0.2s", opacity: 0.5 }} />
            </div>
          </button>
          {receiptsOpen && (
            <div style={{ borderBottom: `1px solid ${LINE}`, paddingBottom: 10, marginBottom: 4 }}>
              <AutoAccountBlock person="خودم" entries={autoKhodam} />
              <AutoAccountBlock person="سعید" entries={autoSaeed} />
              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 10.5, fontWeight: 700, color: INK, opacity: 0.55, marginBottom: 7 }}>دریافتی‌های دیگر (دستی)</div>

          <button onClick={() => setPaymentsOpen((o) => !o)} style={{ width: "100%", background: "transparent", border: "none", padding: "10px 0 6px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>

function CurrencyConverter({ currency, onCurrencyChange }) {
  const [usd, setUsd] = useState("");
  const rate = currency.usdToToman || 0;
  const toman = usd && rate ? Number(usd) * rate : 0;
  const rial = toman * 10;
  return (
    <div>
      <div style={{ fontSize: 11, color: INK, opacity: 0.7, marginBottom: 6 }}>نرخ هر دلار (تومان)</div>
      <NumberInput value={currency.usdToToman || null} onChange={(v) => onCurrencyChange("usdToToman", v || 0)} placeholder="مثلاً ۹۰۰۰۰" style={{ marginBottom: 10, textAlign: "left", fontWeight: 700, color: GOLD }} />
      <div style={{ borderTop: `1px solid ${LINE}`, paddingTop: 10 }}>
        <div style={{ fontSize: 11, color: INK, opacity: 0.7, marginBottom: 6 }}>مبلغ به دلار</div>
        <input inputMode="numeric" style={{ ...inputBase, marginBottom: 10, textAlign: "left", fontWeight: 700 }} placeholder="مبلغ دلار" value={usd} onChange={(e) => setUsd(e.target.value.replace(/[^0-9.]/g, ""))} />
        {rate > 0 && usd ? (
          <div style={{ background: CARD_SOFT, borderRadius: 10, padding: "10px 12px", fontSize: 12.5 }}>
            <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0" }}><span style={{ color: INK, opacity: 0.7 }}>تومان</span><span style={{ fontFamily: MONO, fontWeight: 700, color: INK }}>{fmt(toman)}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0" }}><span style={{ color: INK, opacity: 0.7 }}>ریال</span><span style={{ fontFamily: MONO, fontWeight: 700, color: INK }}>{fmt(rial)}</span></div>
          </div>
        ) : <div style={{ fontSize: 10.5, color: INK, opacity: 0.45 }}>نرخ و مبلغ را وارد کن تا تبدیل شود.</div>}
      </div>
    </div>
  );
}

function LockScreen({ expected, value, setValue, onUnlock }) {
  const [err, setErr] = useState(false);
  function submit() { if (value === expected) onUnlock(); else { setErr(true); setValue(""); } }
  return (
    <div style={{ minHeight: "100vh", background: `linear-gradient(160deg, ${DEEP} 0%, ${DEEP2} 100%)`, direction: "rtl", fontFamily: FONT, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ width: "100%", maxWidth: 320, textAlign: "center" }}>
        <div style={{ width: 64, height: 64, borderRadius: "50%", background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.3)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px" }}>
          <IconLock size={26} color="#fff" />
        </div>
        <div style={{ color: "#fff", fontSize: 16, fontWeight: 700, fontFamily: DISPLAY_FONT, marginBottom: 6 }}>دفتر کارت مرزی</div>
        <div style={{ color: PAGE_TEXT, fontSize: 12, marginBottom: 20 }}>برای ورود، رمز را وارد کن</div>
        <input autoFocus type="password" inputMode="numeric" value={value}

          style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, fontWeight: 700, padding: "12px 0", borderRadius: 12, border: err ? "1px solid #E8A9A2" : "1px solid rgba(255,255,255,0.3)", background: "rgba(255,255,255,0.1)", color: "#fff", marginBottom: err ? 6 : 14 }} />
        {err && <div style={{ color: "#E8A9A2", fontSize: 11.5, marginBottom: 12 }}>رمز اشتباه است</div>}
        <button onClick={submit} style={{ width: "100%", background: "#fff", color: DEEP, border: "none", borderRadius: 12, padding: "12px 0", fontSize: 14, fontWeight: 700 }}>ورود</button>
      </div>
    </div>
  );
}

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(20,24,30,0.5)", zIndex: 60, display: "flex", flexDirection: "column", direction: "rtl" }} onClick={onClose}>
      <div style={{ background: PAPER, maxWidth: 480, width: "100%", margin: "0 auto", height: "100%", display: "flex", flexDirection: "column" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ background: `linear-gradient(150deg, ${DEEP} 0%, ${DEEP2} 100%)`, padding: "16px 16px 14px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 8, background: "rgba(255,255,255,0.14)", border: "1px solid rgba(255,255,255,0.3)", borderRadius: 12, padding: "9px 12px" }}>
              <IconSearch size={16} color="#fff" />
              <input autoFocus value={query} onChange={(e) => setQuery(e.target.value)} placeholder="نام شخص یا شرح را بنویس…"
                style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "#fff", fontSize: 13.5, fontFamily: FONT }} />
              {query && <button onClick={() => setQuery("")} style={{ background: "none", border: "none", display: "flex" }}><IconX size={15} color="#fff" /></button>}
            </div>
            <button onClick={onClose} style={{ background: "rgba(255,255,255,0.14)", border: "1px solid rgba(255,255,255,0.3)", borderRadius: 10, padding: "8px 12px", color: "#fff", fontSize: 12, fontWeight: 700 }}>بستن</button>
          </div>
          {query && <div style={{ color: PAGE_TEXT, fontSize: 12, marginTop: 10 }}>{hits.length} مورد — جمع: <span style={{ fontFamily: MONO, fontWeight: 700, color: "#fff" }}>{fmt(total)}</span> ریال</div>}
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: 14 }}>
          {!query && <div style={{ textAlign: "center", color: INK, opacity: 0.45, fontSize: 12.5, marginTop: 40 }}>مثلاً «کاک صاله»، «سعید» یا «عوارضی» را جستجو کن.<br/>همه‌ی ماه‌ها و تب‌ها با هم گشته می‌شوند.</div>}
          {query && hits.length === 0 && <div style={{ textAlign: "center", color: INK, opacity: 0.45, fontSize: 12.5, marginTop: 40 }}>موردی پیدا نشد.</div>}
          {hits.map((h, i) => (
            <div key={i} style={{ background: CARD, border: `1px solid ${LINE}`, borderRadius: 12, padding: "10px 12px", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 12.5, fontWeight: 700, color: INK, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{h.label || "—"}</div>
                <div style={{ fontSize: 10.5, color: INK, opacity: 0.55, marginTop: 2 }}>{h.kind} • {h.month}{h.date ? " • " + jdateLabel(parseJDate(h.date)) : ""}</div>
              </div>
              <div style={{ fontFamily: MONO, fontSize: 13, fontWeight: 700, color: SAGE, flexShrink: 0 }}>{fmt(h.amount)}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Bars({ series, height = 150 }) {
  const max = Math.max(1, ...series.flatMap((s) => s.values));
  const groups = series[0].values.length;
  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height, padding: "0 4px" }}>
        {Array.from({ length: groups }).map((_, gi) => (
          <div key={gi} style={{ flex: 1, display: "flex", alignItems: "flex-end", justifyContent: "center", gap: 3, height: "100%" }}>
            {series.map((s, si) => (
              <div key={si} title={fmt(s.values[gi])} style={{ flex: 1, maxWidth: 22, height: `${(s.values[gi] / max) * 100}%`, minHeight: s.values[gi] > 0 ? 3 : 0, background: s.color, borderRadius: "4px 4px 0 0" }} />
            ))}
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 10, padding: "6px 4px 0" }}>
        {series[0].labels.map((lbl, i) => (
          <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 10.5, color: INK, opacity: 0.6 }}>{lbl}</div>
        ))}
      </div>
    </div>
  );
}

function ReportTab({ data, grandBalance, onExportPdf }) {
  const labels = data.months.map((m) => m.name);
  const cost = data.months.map((m) => monthCostTotal(m));
  const deposit = data.months.map((m) => monthDepositTotal(m));
  const card = { background: CARD, border: `1px solid ${LINE}`, borderRadius: 16, padding: "15px 16px", marginBottom: 14 };
  const heading = { fontSize: 12.5, fontWeight: 700, color: INK, marginBottom: 14, fontFamily: DISPLAY_FONT };
  const legendItem = (color, text) => (
    <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: INK, opacity: 0.75 }}>
      <span style={{ width: 10, height: 10, borderRadius: 3, background: color }} /> {text}
    </div>
  );
  const totalCost = cost.reduce((a, b) => a + b, 0);
  const totalDep = deposit.reduce((a, b) => a + b, 0);
  const balByMonth = data.months.map((m) => monthBalance(m));

  return (
    <>
      <button onClick={onExportPdf} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, background: DEEP, color: "#fff", border: "none", borderRadius: 12, padding: "12px 0", fontSize: 13, fontWeight: 700, marginBottom: 14 }}>
        <IconFile size={15} /> خروجی PDF / عکس برای اشتراک‌گذاری
      </button>

      <div style={card}>
        <div style={heading}>هزینه و دریافتی هر ماه</div>
        {labels.length ? <Bars series={[
          { values: cost, labels, color: GOLD },
          { values: deposit, labels, color: SAGE },
        ]} /> : <div style={{ color: INK, opacity: 0.5, fontSize: 12 }}>ماهی ثبت نشده.</div>}
        <div style={{ display: "flex", gap: 14, justifyContent: "center", marginTop: 12 }}>
          {legendItem(GOLD, "هزینه")}
          {legendItem(SAGE, "دریافتی")}
        </div>
      </div>

      <div style={card}>
        <div style={heading}>مقایسه با ماه قبل</div>
        {data.months.length < 2 ? (
          <div style={{ color: INK, opacity: 0.5, fontSize: 12 }}>برای مقایسه حداقل دو ماه لازم است.</div>
        ) : data.months.slice(1).map((m, i) => {
          const prev = data.months[i];
          const cur = monthBalance(m), pre = monthBalance(prev);
          const diff = cur - pre;
          const up = diff > 0;
          const pct = pre !== 0 ? Math.round((diff / Math.abs(pre)) * 100) : null;
          return (
            <div key={m.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: `1px solid ${LINE}` }}>
              <span style={{ fontSize: 12, color: INK }}>{prev.name} ← {m.name}</span>
              <span style={{ display: "flex", alignItems: "center", gap: 5, fontFamily: MONO, fontSize: 12, fontWeight: 700, color: up ? RUST : SAGE }}>
                {up ? <IconUp size={13} /> : <IconDown size={13} />}
                {fmt(Math.abs(diff))}{pct !== null ? ` (${Math.abs(pct)}%)` : ""}
              </span>
            </div>
          );
        })}
        <div style={{ fontSize: 10.5, color: INK, opacity: 0.5, marginTop: 8, lineHeight: 1.6 }}>سبز = بدهی کمتر شده، قرمز = بدهی بیشتر شده.</div>
      </div>

      <div style={card}>
        <div style={heading}>مانده (بدهی) هر ماه</div>
        {labels.length ? <Bars series={[{ values: balByMonth.map((b) => Math.abs(b)), labels, color: RUST }]} /> : null}
        <div style={{ marginTop: 12 }}>
          {data.months.map((m) => {
            const b = monthBalance(m);
            return (
              <div key={m.id} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", fontSize: 12, borderBottom: `1px solid ${LINE}` }}>
                <span style={{ color: INK }}>{m.name}</span>
                <span style={{ fontFamily: MONO, fontWeight: 700, color: b > 0 ? RUST : SAGE }}>{b > 0 ? "" : "−"}{fmt(Math.abs(b))}</span>
              </div>
            );
          })}
        </div>
      </div>

      <div style={card}>
        <div style={heading}>خلاصه کل</div>
        <div style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 12.5 }}><span style={{ color: INK, opacity: 0.7 }}>جمع هزینه‌ها</span><span style={{ fontFamily: MONO, fontWeight: 700, color: GOLD }}>{fmt(totalCost)}</span></div>
        <div style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 12.5 }}><span style={{ color: INK, opacity: 0.7 }}>جمع دریافتی‌ها</span><span style={{ fontFamily: MONO, fontWeight: 700, color: SAGE }}>{fmt(totalDep)}</span></div>
        <div style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 12.5, borderTop: `1px solid ${LINE}`, marginTop: 4, paddingTop: 8 }}><span style={{ color: INK, fontWeight: 700 }}>مانده کل</span><span style={{ fontFamily: MONO, fontWeight: 700, color: (totalCost - totalDep) > 0 ? RUST : SAGE }}>{fmt(Math.abs(totalCost - totalDep))}</span></div>
      </div>
    </>
  );
}

function PeopleTab({ data }) {
  const people = peopleSummary(data);
  const card = { background: CARD, border: `1px solid ${LINE}`, borderRadius: 16, padding: "14px 15px", marginBottom: 12 };
  if (!people.length) return <div style={{ ...card, color: INK, opacity: 0.55, fontSize: 12.5, textAlign: "center", padding: "24px 15px" }}>هنوز موردی برای هیچ شخصی ثبت نشده.</div>;
  const line = (label, value, color) => (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: `1px solid ${LINE}` }}>
      <span style={{ fontSize: 12, color: INK, opacity: 0.8 }}>{label}</span>
      <span style={{ fontFamily: MONO, fontSize: 13, fontWeight: 700, color }}>{value}</span>
    </div>
  );
  return (
    <>
      <div style={{ background: "#F3EBDF", border: `1px solid #E4D3BC`, borderRadius: 12, padding: "10px 12px", marginBottom: 12, fontSize: 11, color: "#7A5426", lineHeight: 1.8 }}>
        برای هر شخص: دریافتی از «دفتر کارت» (پول واردشده به اسم او)، و «واریزی من به او» (پولی که خودت برایش فرستاده‌ای). جمع = مجموع این دو.
      </div>
      {people.map((p) => {
        const totalReceived = p.ledgerReceived + p.manualReceived;
        const sum = totalReceived + p.paid;
        const color = personColor(p.name);
        return (
          <div key={p.name} style={{ ...card, borderRight: `4px solid ${color}` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 6 }}>
              <div style={{ width: 30, height: 30, borderRadius: "50%", background: color, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, flexShrink: 0 }}>{(p.name || "?").trim().charAt(0)}</div>
              <span style={{ fontSize: 14, fontWeight: 700, color: INK, fontFamily: DISPLAY_FONT }}>{p.name}</span>
            </div>
            {line("دریافتی از دفتر کارت", fmt(p.ledgerReceived), SAGE)}
            {p.manualReceived > 0 && line("دریافتی دستی (تب دریافتی‌ها)", fmt(p.manualReceived), SAGE)}
            {line("واریزی من به او", fmt(p.paid), GOLD)}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 9, marginTop: 2 }}>
              <span style={{ fontSize: 12.5, color: INK, fontWeight: 700 }}>جمع کل</span>
              <span style={{ fontFamily: MONO, fontSize: 14, fontWeight: 700, color }}>{fmt(sum)}</span>
            </div>
          </div>
        );
      })}
    </>
  );
}

function NotesTab({ notes, onAdd, onUpdate, onRemove }) {
  return (
    <>
      <button onClick={onAdd} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, background: DEEP, color: "#fff", border: "none", borderRadius: 12, padding: "12px 0", fontSize: 13, fontWeight: 700, marginBottom: 14 }}>
        <IconPlus size={15} /> یادداشت جدید
      </button>
      {(!notes || notes.length === 0) && (
        <div style={{ textAlign: "center", color: INK, opacity: 0.45, fontSize: 12.5, marginTop: 20, lineHeight: 1.8 }}>
          یادداشت‌های سریع و قرارهای شفاهی را اینجا بنویس تا فراموش نشود.<br/>مثلاً «قرار شد کاک صاله فردا ۵۰۰ بریزد».
        </div>
      )}
      {(notes || []).map((n) => (
        <div key={n.id} style={{ background: CARD, border: `1px solid ${LINE}`, borderRadius: 14, padding: "12px 13px", marginBottom: 10 }}>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
            <button onClick={() => onUpdate(n.id, "done", !n.done)} style={{ marginTop: 2, width: 20, height: 20, borderRadius: 6, border: `1.5px solid ${n.done ? SAGE : LINE}`, background: n.done ? SAGE : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              {n.done && <IconCheck size={12} color="#fff" />}
            </button>
            <textarea value={n.text} onChange={(e) => onUpdate(n.id, "text", e.target.value)} placeholder="یادداشت…" rows={2}
              style={{ flex: 1, resize: "vertical", border: "none", outline: "none", background: "transparent", fontFamily: FONT, fontSize: 13, color: n.done ? "#9AA4B2" : INK, textDecoration: n.done ? "line-through" : "none", lineHeight: 1.7 }} />
            <button onClick={() => onRemove(n.id)} style={{ background: "none", border: "none", opacity: 0.35, flexShrink: 0, marginTop: 2 }}><IconTrash size={14} color={RUST} /></button>
          </div>
          <div style={{ fontSize: 10, color: INK, opacity: 0.4, marginTop: 6, textAlign: "left" }}>{new Date(n.ts).toLocaleDateString("fa-IR")}</div>
        </div>
      ))}
    </>
  );
}




const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
